name: Weather.ia Automação # Nome do workflow que aparecerá na aba Actions do GitHub

on:                                                  # Define quais eventso disparam a execução automática
  schedule:                                          # Agendamento periódico via expressão cron (horário em UTC)
    - cron: "*/30 * * * *"   # Executa a cada 30 minutos (nos minutos 00 e 30)
  workflow_dispatch:                                # Permite disparar manualmente via botão no GitHub

jobs:                      # Agrupa os conjuntos de passos que serão executados
  verificar-clima:         # Identificador do job de verificação meteorológica
    runs-on: ubuntu-latest # Provisiona uma máquina virtual Linux Ubuntu gratuita na nuvem

    steps:                                 # Lista sequêncial de tarefas executadas dentro do runner
      - name: Baixar codigo do repositório # Passo 01: clona o codigo do seu repositorio Git Hub
        uses: actions/checkout@v4          # Action oficial do Git Hub para checkout do codigo

      - name: Configurar Python       # Passo 02: Instala e seleciona a versão do Python no ambiente
        uses: actions/setup-python@v5 # Action oficial para configurar o interpretador do Python
        with:                         # Parâmetros de configuração do Python
          python-version: "3.11"      # Define a versão do Python a ser utilizada

      - name: Instalar dependencias # Passo 03: Instala as bibliotecas listadas no requirements.txt
        run: |                      # Permite executar múltiplos comandos do shell no Linux runner
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Weather.ia                               # Passo 04: roda o orquestrador principal do projeto
        env:                                                    # Injeta variaveis de ambiente seguras apenas durante este passo
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }} # Le o token do Git Hub Secret
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}     # Lê o chat_id do Git Hub Secret
        run: python main.py                                     # Executa o fluxo completo (API -> Regras -> Telegram)